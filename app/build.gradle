plugins { id 'com.android.application' }
// 下载仓库即可使用预编译 MNN；仅显式指定属性时才编译引擎源码。
def mnnArguments = ['-DMNN_USE_PREBUILT=ON']
if (project.hasProperty('mnnSourceRoot')) {
    mnnArguments = ['-DMNN_USE_PREBUILT=OFF', "-DMNN_SOURCE_ROOT=${rootProject.file(project.property('mnnSourceRoot')).absolutePath}"]
}
android {
    namespace 'cn.local.ocr'
    compileSdk 35
    // APK 保留 Debug 签名与调试能力，生产原生引擎始终使用 Release 优化。
    defaultConfig { applicationId 'cn.local.ocr'; minSdk 26; targetSdk 35; versionCode 16; versionName '0.7.9-ocr'; ndk { abiFilters 'arm64-v8a' }; externalNativeBuild { cmake { arguments '-DANDROID_STL=c++_shared', '-DCMAKE_BUILD_TYPE=Release', "-DDOCOCR_SOURCE_ROOT=${rootProject.file('native/docprase').absolutePath}", *mnnArguments; cppFlags '-O3'; targets 'dococr_jni' } } }
    ndkVersion '28.1.13356709'
    externalNativeBuild { cmake { path file('src/main/cpp/CMakeLists.txt'); version '3.31.6' } }
    flavorDimensions += 'audience'
    productFlavors {
        user { dimension 'audience'; buildConfigField 'boolean', 'TEST_FEATURES', 'false'; resValue 'string', 'app_name', '随手识别' }
        lab { dimension 'audience'; applicationIdSuffix '.test'; buildConfigField 'boolean', 'TEST_FEATURES', 'true'; resValue 'string', 'app_name', '随手识别 · 测试' }
    }
    buildFeatures { buildConfig true }
    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
    packaging {
        resources { excludes += ['META-INF/DEPENDENCIES','META-INF/LICENSE*','META-INF/NOTICE*','META-INF/INDEX.LIST'] }
        // OpenCV 与 MNN 均依赖 libc++；交付检查核对 APK 使用当前 NDK 的运行库。
        jniLibs { pickFirsts += ['**/libc++_shared.so'] }
    }
    testOptions { unitTests.returnDefaultValues = true; unitTests.all { systemProperty "officeFixtureOutput", rootProject.file("verification/office-fixtures").absolutePath } }
}
// Imported target 负责链接；原生依赖目录显式交给 AGP 打包。
if (!project.hasProperty('mnnSourceRoot')) {
    android.sourceSets.main.jniLibs.srcDir(rootProject.file('native/mnn-prebuilt/lib'))
}
dependencies {
    implementation 'org.opencv:opencv:4.12.0'
    implementation 'com.tom-roush:pdfbox-android:2.0.27.0'
    implementation 'org.apache.poi:poi:4.1.2'
    implementation 'org.apache.poi:poi-scratchpad:4.1.2'
    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.json:json:20240303'
}

def installWebDependencies = tasks.register('installWebDependencies', Exec) {
    workingDir rootProject.projectDir
    commandLine(System.getProperty('os.name').toLowerCase().contains('windows') ? ['cmd', '/c', 'npm', 'ci'] : ['npm', 'ci'])
    inputs.files(rootProject.files('package.json', 'package-lock.json'))
    outputs.file(rootProject.file('node_modules/.package-lock.json'))
}
def bundleWeb = tasks.register('bundleWeb', Exec) {
    dependsOn installWebDependencies
    workingDir rootProject.projectDir
    commandLine 'node', 'web/build.mjs'
    inputs.files(rootProject.fileTree('web') { include '*.jsx', '*.js', '*.mjs', '*.css' })
    inputs.files(rootProject.files('package.json', 'package-lock.json'))
    inputs.dir(rootProject.file('fixtures/replay'))
    outputs.dir(rootProject.file('web/dist'))
    outputs.dir(rootProject.file('web/generated'))
    outputs.dir(file('src/main/assets/web'))
    outputs.dir(file('src/main/assets/fixtures'))
}
def bundleMnnLegal = tasks.register('bundleMnnLegal', Copy) {
    from(rootProject.file('native/mnn-prebuilt/LICENSE.txt')) { rename { 'mnn-LICENSE.txt' } }
    from(rootProject.file('native/mnn-prebuilt/licenses')) { into 'mnn' }
    into file('build/generated/mnnLegal/legal')
}
android.sourceSets.main.assets.srcDir(file('build/generated/mnnLegal'))
tasks.named('preBuild').configure { dependsOn bundleWeb, bundleMnnLegal }
