plugins { id 'com.android.application' }
// 正式克隆使用仓库内固定依赖；本工作区允许复用同版本的相邻 MNN。
def mnnRoot = rootProject.file('native/MNN')
if (!mnnRoot.exists() && rootProject.file('../MNN/CMakeLists.txt').exists()) mnnRoot = rootProject.file('../MNN')
if (project.hasProperty('mnnSourceRoot')) mnnRoot = file(project.property('mnnSourceRoot'))
android {
    namespace 'cn.local.ocr'
    compileSdk 35
    // APK 保留 Debug 签名与调试能力，生产原生引擎始终使用 Release 优化。
    defaultConfig { applicationId 'cn.local.ocr'; minSdk 26; targetSdk 35; versionCode 13; versionName '0.7.6-ocr'; ndk { abiFilters 'arm64-v8a' }; externalNativeBuild { cmake { arguments '-DANDROID_STL=c++_shared', '-DCMAKE_BUILD_TYPE=Release', "-DDOCOCR_SOURCE_ROOT=${rootProject.file('native/docprase').absolutePath}", "-DMNN_SOURCE_ROOT=${mnnRoot.absolutePath}"; cppFlags '-O3'; targets 'dococr_jni' } } }
    ndkVersion '28.1.13356709'
    externalNativeBuild { cmake { path file('src/main/cpp/CMakeLists.txt'); version '3.31.6' } }
    flavorDimensions += 'audience'
    productFlavors {
        user { dimension 'audience'; buildConfigField 'boolean', 'TEST_FEATURES', 'false'; resValue 'string', 'app_name', '随手识别' }
        lab { dimension 'audience'; applicationIdSuffix '.test'; buildConfigField 'boolean', 'TEST_FEATURES', 'true'; resValue 'string', 'app_name', '随手识别 · 测试' }
    }
    buildFeatures { buildConfig true }
    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
    packaging {
        resources { excludes += ['META-INF/DEPENDENCIES','META-INF/LICENSE*','META-INF/NOTICE*','META-INF/INDEX.LIST'] }
        // OpenCV 与 MNN 均依赖 libc++；交付检查核对 APK 使用当前 NDK 的运行库。
        jniLibs { pickFirsts += ['**/libc++_shared.so'] }
    }
    testOptions { unitTests.returnDefaultValues = true; unitTests.all { systemProperty "officeFixtureOutput", rootProject.file("verification/office-fixtures").absolutePath } }
}
dependencies {
    implementation 'org.opencv:opencv:4.12.0'
    implementation 'com.tom-roush:pdfbox-android:2.0.27.0'
    implementation 'org.apache.poi:poi:4.1.2'
    implementation 'org.apache.poi:poi-scratchpad:4.1.2'
    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.json:json:20240303'
}

def bundleWeb = tasks.register('bundleWeb', Exec) {
    workingDir rootProject.projectDir
    commandLine 'node', 'web/build.mjs'
    inputs.files(rootProject.fileTree('web') { include '*.jsx', '*.js', '*.css', 'build.mjs' })
    inputs.files(rootProject.files('package.json', 'package-lock.json', 'prototypes/ocr-streaming/fixture-data.json', 'prototypes/ocr-streaming/stream-state.mjs'))
    inputs.dir(rootProject.file('prototypes/ocr-streaming/fixtures'))
    outputs.dir(file('src/main/assets/web'))
    outputs.dir(file('src/main/assets/fixtures'))
}
tasks.named('preBuild').configure { dependsOn bundleWeb }
